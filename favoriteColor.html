<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Favorite Color</title>
  </head>
  <body>
    <main class="h-screen flex justify-center items-center flex-col space-y-4">
      <div class="flex space-x-2">
        <div class="w-56 border p-2 rounded-lg">
          <p class="font-black text-lg mb-2">Favorite</p>
          <div class="favorite space-y-2"></div>
          <input
            type="color"
            id="color-input"
            class="border rounded-lg w-32 h-10"
            placeholder="Add a color..."
          />
        </div>
        <button
          onclick="favRandomColor()"
          class="cursor-pointer bg-blue-500 text-white px-5 py-2 rounded-xl"
        >
          Add
        </button>

        <button
          onclick="likeColor()"
          class="cursor-pointer cursor-pointer bg-blue-500 text-white px-5 py-2 rounded-xl hover:scale-101 hover:bg-red-300"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-heart-icon lucide-heart"
          >
            <path
              d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
            />
          </svg>
        </button>
      </div>
    </main>

    <script src="favcolor.js"></script>
  </body>
</html>
