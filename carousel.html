<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Carousel</title>
  </head>
  <body>
    <main class="h-screen flex justify-center items-center flex-col space-y-6">
      <h1 class="text-2xl font-semibold">Simple Image Carousel</h1>
      <div class="relative w-full max-w-3xl overflow-hidden">
        <div
          id="carousel"
          class="flex transition-transform duration-500 ease-in-out"
        >
          <img
            src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?auto=format&fit=crop&w=800&q=80"
            alt="image-1"
            class="w-full flex-shrink-0 object-cover"
          />
          <img
            src="https://images.unsplash.com/photo-1493612276216-ee3925520721?auto=format&fit=crop&w=800&q=80"
            alt="image-2"
            class="w-full flex-shrink-0 object-cover"
          />
          <img
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
            alt="image-3"
            class="w-full flex-shrink-0 object-cover"
          />
        </div>

        <button
          id="prev"
          class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow hover:text-blue-600"
        >
          ◀
        </button>
        <button
          id="next"
          class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow hover:text-blue-600"
        >
          ▶
        </button>
      </div>
    </main>

    <script>
      const carousel = document.getElementById("carousel");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");

      let index = 0;

      const handleCarousel = () => {
        const width = carousel.clientWidth;
        carousel.style.transform = `translateX(-${index * width}px)`;
      };

      next.addEventListener("click", () => {
        index = (index + 1) % carousel.children.length;
        handleCarousel();
      });

      prev.addEventListener("click", () => {
        index =
          (index - 1 + carousel.children.length) % carousel.children.length;
        handleCarousel();
      });

      window.addEventListener("resize", handleCarousel);

      //   setInterval(() => {
      //     index = (index + 1) % carousel.children.length;
      //     handleCarousel();
      //   }, 2000);
    </script>
  </body>
</html>
