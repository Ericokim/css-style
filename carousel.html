<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Carousel</title>
  </head>
  <body>
    <main class="h-screen flex justify-center items-center flex-col space-y-4">
      <div
        id="carousel"
        class="flex space-x-2 transition duration-500 ease-in-out"
      >
        <img
          id="1"
          src="https://images.unsplash.com/photo-1756474215990-a18a9a0521d5?q=80&w=164&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="image-1"
          class="w-full flex-shrink-0 object-contain"
        />
        <img
          id="2"
          src="https://images.unsplash.com/photo-1756474215831-4e5f8309c6bc?q=80&w=164&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="image-2"
          class="w-full flex-shrink-0 object-contain"
        />
        <img
          id="3"
          src="https://images.unsplash.com/photo-1756474215958-f0c2a31eddc1?q=80&w=164&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="image-3"
          class="w-full flex-shrink-0 object-contain"
        />
      </div>

      <div class="flex gap-4">
        <button
          id="prev"
          class="text-lg font-medium hover:text-blue-500 cursor-pointer"
        >
          <- Prev
        </button>
        <button
          id="next"
          class="text-lg font-medium hover:text-blue-500 cursor-pointer"
        >
          Next ->
        </button>
      </div>
    </main>

    <script>
      const carousel = document.getElementById("carousel");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");

      let index = 0;

      const handelCarousel = () => {
        const width = carousel.clientWidth;
        carousel.style.transform = `translateX(-${index * width}px)`;
      };

      next.addEventListener("click", () => {
        index = Math.min(index + 1, carousel.children.length - 1);
        handelCarousel();
      });

      prev.addEventListener("click", () => {
        index = Math.min(index - 1, 0);
        handelCarousel();
      });

      window.addEventListener("resize", handelCarousel);
    </script>
  </body>
</html>
